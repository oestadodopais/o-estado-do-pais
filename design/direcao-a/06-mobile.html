<p class="map-cite" data-verbatim="caop-legenda-mapa" lang="pt-PT">Posições: Carta Administrativa Oficial de Portugal 2025, Direção-Geral do Território. Centróides ponderados pela área, calculados a partir dos polígonos oficiais. Madeira à mesma escala do Continente; Açores a 0,38× dessa escala, por o arquipélago se estender por cerca de 600 km. Detalhe completo no colofão.</p>
<details class="deep">
<summary>Método, ressalvas e proveniência</summary>
<div class="deep-body">
<div class="deep-item">
<div class="deep-k">O que o mapa não diz</div>
<p class="deep-v">O ponto aceso marca cobertura editorial, não qualidade nem importância. Os restantes pontos marcam a posição do município e mais nada.</p>
</div>
<div class="deep-item">
<div class="deep-k">Coordenadas · fonte</div>
<p class="deep-v verbatim" data-verbatim="caop-fonte" lang="pt-PT">Carta Administrativa Oficial de Portugal (CAOP) 2025
Publicação: Direção-Geral do Território (DGT)
Distribuição: dados.gov.pt · licença CC-BY
Ficheiros: CAOP_Continente_2025-gpkg.zip · CAOP_RAA_2025-gpkg.zip · CAOP_RAM_2025-gpkg.zip (GeoPackage)
https://geo2.dgterritorio.gov.pt/caop/
https://dados.gov.pt/datasets/carta-administrativa-oficial-de-portugal-caop2025-continente
Acedido a 12 de Agosto de 2026.</p>
</div>
<div class="deep-item">
<div class="deep-k">Os dados deste mapa</div>
<p class="deep-v">Uma linha por município: nome, distrito ou ilha, região e a posição normalizada que o mapa desenha. O cabeçalho traz a citação da CAOP e a data de acesso, tal como aparecem aqui.</p>
<p><a class="ligacao-dados" href="https://oestadodopaís.pt/dados/municipios-308.csv">descarregar os dados (CSV) ↓</a></p>
</div>
<div class="deep-item">
<div class="deep-k">Coordenadas · processamento</div>
<p class="deep-v verbatim" data-verbatim="caop-processamento" lang="pt-PT">Contagem verificada nos ficheiros oficiais: 278 municípios no Continente, 19 nos Açores, 11 na Madeira = 308.

Para cada município: centróide ponderado pela área, calculado sobre os polígonos oficiais no sistema de coordenadas nativo de cada ficheiro (ETRS89/PT-TM06 no Continente; PTRA08/UTM 25N, 26N e 28N nos arquipélagos) e convertido para WGS84.

Verificação: a área calculada a partir da geometria reproduz o campo area_ha publicado pela DGT com erro relativo máximo de 0,00023% nos 308 municípios.

Posições projetadas em Web Mercator e normalizadas para o referencial da página. Madeira à mesma escala do Continente; Açores a 0,38× dessa escala. Nenhuma coordenada foi estimada.</p>
