<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" role="img" aria-label="O Estado do País, monocromático">
  <title>K5 · o valor a 70 % · monocromático</title>
  <!-- DERIVADA, 29.08.2026, ADENDA 8. A prova de monocromia: as três barras na
       mesma tinta, sem cobalto. K5 põe o valor a 238 de 340, ou seja 70 %, que é
       o ponto entre a leitura de livro-razão do diretor (58 %) e o braço do meio
       de um «E» de tipo (perto de 80 % dos outros). -->
  <rect x="86" y="100" width="340" height="72"/>
  <rect x="86" y="220" width="238" height="72"/>
  <rect x="86" y="340" width="340" height="72"/>
</svg>
