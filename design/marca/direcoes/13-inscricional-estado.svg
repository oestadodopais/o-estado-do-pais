    <g class="sinal-favicon" transform="translate(146.07 94.33) scale(1.08)">
    <!-- 32 e 16 px: a haste e o fino engrossam de 0,125 e 0,082 para 0,175 e
         0,135 H, porque um fino de 0,082 H a 16 px dá 0,92 px. O sulco fica, e
         fica sem se ver: a este tamanho mede menos de um píxel. -->
