    <g class="sinal-favicon" transform="translate(144.4 76) scale(1.2)">
    <!-- 32 e 16 px: o fino sobe de 0,040 para 0,128 H e as serifas saem, porque
         a 16 px um fino de 0,040 H dá 0,45 px e o braço abre. O contraste cai de
         6,55 para 1,9, e com ele cai a voz: é o preço medido desta direção, e
         está dito nas NOTAS. -->
    <path class="tinta" d="M0 0L73.5 0L73.5 300L0 300Z"/>
    <path class="tinta" d="M0 0L186 0L186 38.4L0 38.4Z"/>
    <path class="tinta" d="M0 261.6L186 261.6L186 300L0 300Z"/>
