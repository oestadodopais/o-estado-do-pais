<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Direção A · a ligadura OE">
  <title>Direção A · a ligadura OE</title>
  <desc>As duas iniciais soldadas numa letra só, tinta sobre papel.</desc>
  <style>
    .campo { fill: #f6f7f4; }
    .tinta { fill: #17191b; }
    .tinta-t { fill: none; stroke: #17191b; }
    .acento { fill: #1f4e8c; }
    .acento-t { fill: none; stroke: #1f4e8c; }
    /* A costura: uma silhueta feita de distritos encostados fica com fios de
       papel entre eles quando se enche sem traço. O traço da mesma cor fecha-os. */
    .acento-costura { fill: #1f4e8c; stroke: #1f4e8c; stroke-width: 2; }
    svg[data-tema="escuro"] .campo { fill: #15171a; }
    svg[data-tema="escuro"] .tinta { fill: #eceeea; }
    svg[data-tema="escuro"] .tinta-t { stroke: #eceeea; }
    svg[data-tema="escuro"] .acento { fill: #7fa6dc; }
    svg[data-tema="escuro"] .acento-t { stroke: #7fa6dc; }
    svg[data-tema="escuro"] .acento-costura { fill: #7fa6dc; stroke: #7fa6dc; }
    /* A simplificação de 32 e 16 px: a mesma forma, com o que morre tirado. */
    .sinal-favicon { display: none; }
    svg[data-forma="favicon"] .sinal { display: none; }
    svg[data-forma="favicon"] .sinal-favicon { display: block; }
    /* O `maskable` do Android: o campo fica, o sinal encolhe para dentro do
       círculo seguro de raio 40 %. */
    svg[data-forma="maskable"] .sinal,
    svg[data-forma="maskable"] .sinal-favicon {
      transform: scale(0.78);
      transform-origin: 256.0px 256.0px;
      transform-box: view-box;
    }
  </style>
  <rect class="campo" x="0" y="0" width="512" height="512"/>
  <g class="sinal" transform="translate(-13.07 -43.3) scale(1.17)">
    <!-- A ligadura «OE»: H=222, haste=51.7, fino=22.2,
         contraste 2.33. A contraforma é um rectângulo de
         119 x 178 com o canto a 22.2.
         A haste do «E» começa em x=246.5, que é a haste
         direita do «O»: as duas letras têm uma haste só. -->
    <path class="tinta" fill-rule="evenodd" d="M76.18 256A111 111 0 1 1 298.18 256A111 111 0 1 1 76.18 256ZM150.11 167.2L224.25 167.2A22.2 22.2 0 0 1 246.45 189.4L246.45 322.6A22.2 22.2 0 0 1 224.25 344.8L150.11 344.8A22.2 22.2 0 0 1 127.91 322.6L127.91 189.4A22.2 22.2 0 0 1 150.11 167.2Z"/>
    <path class="tinta" d="M246.45 145L298.18 145L298.18 367L246.45 367ZM246.45 145L384.09 145L384.09 167.2L246.45 167.2ZM246.45 344.8L384.09 344.8L384.09 367L246.45 367ZM246.45 246.45L353.01 246.45L353.01 265.55L246.45 265.55ZM361.89 145L384.09 145L384.09 193.84L361.89 193.84ZM361.89 318.16L384.09 318.16L384.09 367L361.89 367ZM333.92 229.27L353.01 229.27L353.01 282.73L333.92 282.73Z"/>
  </g>
  <g class="sinal-favicon" transform="translate(-13.07 -43.3) scale(1.17)">
    <!-- 32 e 16 px: as lajes de remate somem antes de se verem, e o
         canto recto da contraforma não chega a um píxel. Fica a
         ligadura nua. -->
    <path class="tinta" fill-rule="evenodd" d="M76.18 256A111 111 0 1 1 298.18 256A111 111 0 1 1 76.18 256ZM127.91 256A59.27 88.8 0 1 1 246.45 256A59.27 88.8 0 1 1 127.91 256Z"/>
    <path class="tinta" d="M246.45 145L298.18 145L298.18 367L246.45 367ZM246.45 145L384.09 145L384.09 167.2L246.45 167.2ZM246.45 344.8L384.09 344.8L384.09 367L246.45 367ZM246.45 246.45L353.01 246.45L353.01 265.55L246.45 265.55Z"/>
  </g>
</svg>
