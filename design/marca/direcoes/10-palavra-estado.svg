    </g>
    <g class="sinal-favicon" transform="translate(144.4 256) scale(1.2)">
    <!-- 60, 32 e 16 px: a palavra a 60 dá 10 px de maiúscula e é uma
         mancha. Fica o «E» da palavra, sozinho, à altura toda. -->
    <path class="tinta" d="M0 -150L69.9 -150L69.9 150L0 150ZM0 -150L186 -150L186 -120L0 -120ZM0 120L186 120L186 150L0 150ZM0 -12.9L144 -12.9L144 12.9L0 12.9ZM156 -150L186 -150L186 -84L156 -84ZM156 84L186 84L186 150L156 150ZM118.2 -36.12L144 -36.12L144 36.12L118.2 36.12Z"/>
