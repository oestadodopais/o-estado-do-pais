    <path class="tinta" d="M529.33 111.4L605.83 111.4L605.83 384.7L529.33 384.7Z"/>
    <path class="tinta" d="M502.27 178L654.53 178L654.53 258.32L502.27 258.32Z"/>
    <path class="tinta" fill-rule="evenodd" d="M673.13 289A135.28 111 0 1 1 943.69 289A135.28 111 0 1 1 673.13 289ZM749.63 289A58.78 34.5 0 1 1 867.19 289A58.78 34.5 0 1 1 749.63 289Z"/>
    <path class="tinta" d="M867.19 178L943.69 178L943.69 400L867.19 400Z"/>
