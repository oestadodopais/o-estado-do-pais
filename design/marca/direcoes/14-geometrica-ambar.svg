    </g>
    <g class="sinal-favicon" transform="translate(126.4 76) scale(1.2)">
    <!-- 32 e 16 px: não muda quase nada, e é isso que esta voz tem de seu, uma
         letra sem finos não tem nada que morra ao encolher. A grossura sobe de
         0,275 para 0,285 H e o braço de 0,70 para 0,72 H, para encher o campo. -->
    <path class="tinta" d="M0 0L85.5 0L85.5 300L0 300Z"/>
    <path class="tinta" d="M0 0L216 0L216 85.5L0 85.5Z"/>
    <path class="tinta" d="M0 214.5L216 214.5L216 300L0 300Z"/>
    <path class="tinta" d="M0 107.25L180 107.25L180 192.75L0 192.75Z"/>
    </g>
    <g class="sinal-letra" transform="translate(130 76) scale(1.2)">
    <!-- 180, 120 e 60 px: fica o «E» da palavra, com os mesmos números. -->
    <path class="tinta" d="M0 0L82.5 0L82.5 300L0 300Z"/>
    <path class="tinta" d="M0 0L210 0L210 82.5L0 82.5Z"/>
    <path class="tinta" d="M0 217.5L210 217.5L210 300L0 300Z"/>
    <path class="tinta" d="M0 108.75L174 108.75L174 191.25L0 191.25Z"/>
    </g>
  </g>
</svg>
