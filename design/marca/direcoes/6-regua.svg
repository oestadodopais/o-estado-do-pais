<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Direção F · a régua">
  <title>Direção F · a régua</title>
  <desc>O instrumento de convergência reduzido a um sinal.</desc>
  <style>
    .campo { fill: #f6f7f4; }
    .tinta { fill: #17191b; }
    .tinta-t { fill: none; stroke: #17191b; }
    .acento { fill: #1f4e8c; }
    .acento-t { fill: none; stroke: #1f4e8c; }
    /* A costura: uma silhueta feita de distritos encostados fica com fios de
       papel entre eles quando se enche sem traço. O traço da mesma cor fecha-os. */
    .acento-costura { fill: #1f4e8c; stroke: #1f4e8c; stroke-width: 2; }
    svg[data-tema="escuro"] .campo { fill: #15171a; }
    svg[data-tema="escuro"] .tinta { fill: #eceeea; }
    svg[data-tema="escuro"] .tinta-t { stroke: #eceeea; }
    svg[data-tema="escuro"] .acento { fill: #7fa6dc; }
    svg[data-tema="escuro"] .acento-t { stroke: #7fa6dc; }
    svg[data-tema="escuro"] .acento-costura { fill: #7fa6dc; stroke: #7fa6dc; }
    /* A simplificação de 32 e 16 px: a mesma forma, com o que morre tirado. */
    .sinal-favicon { display: none; }
    svg[data-forma="favicon"] .sinal { display: none; }
    svg[data-forma="favicon"] .sinal-favicon { display: block; }
    /* O `maskable` do Android: o campo fica, o sinal encolhe para dentro do
       círculo seguro de raio 40 %. */
    svg[data-forma="maskable"] .sinal,
    svg[data-forma="maskable"] .sinal-favicon {
      transform: scale(0.78);
      transform-origin: 256.0px 256.0px;
      transform-box: view-box;
    }
  </style>
  <rect class="campo" x="0" y="0" width="512" height="512"/>
  <g class="sinal">
    <!-- A referência em pé (64 x 300), a barra da
         distância (68 de altura) e o selo do valor na ponta
         (68 x 68). Três peças da casa, nenhuma inventada. -->
    <rect class="tinta" x="76" y="222" width="68" height="68"/>
    <rect class="acento" x="144" y="222" width="228" height="68"/>
    <rect class="tinta" x="372" y="106" width="64" height="300"/>
  </g>
  <g class="sinal-favicon">
    <!-- 32 e 16 px: o quadrado do selo e a barra colam-se num traço só.
         Fica a barra a bater na referência, que é o que a régua diz. -->
    <rect class="acento" x="76" y="210" width="296" height="92"/>
    <rect class="tinta" x="372" y="106" width="64" height="300"/>
  </g>
</svg>
