    <path class="tinta" d="M0 100L135 100L135 161.5L0 161.5Z"/>
    <path class="tinta" d="M0 338.5L135 338.5L135 400L0 400Z"/>
    <path class="acento" d="M0 214L111 214L111 286L0 286Z"/>
