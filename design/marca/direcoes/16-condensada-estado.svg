    </g>
    <g class="sinal-favicon" transform="translate(171.4 76) scale(1.2)">
    <!-- 32 e 16 px: a mesma letra, 4 % mais grossa. -->
    <path class="tinta" d="M0 0L73.5 0L73.5 300L0 300Z"/>
    <path class="tinta" d="M0 0L141 0L141 64.5L0 64.5Z"/>
    <path class="tinta" d="M0 235.5L141 235.5L141 300L0 300Z"/>
    <path class="acento" d="M0 114L117 114L117 186L0 186Z"/>
    </g>
    <g class="sinal-letra" transform="translate(175 76) scale(1.2)">
    <!-- 180, 120 e 60 px: fica o «E» da palavra, estreito. É o sinal com menos
         largura das sete, e por isso é o que deixa mais campo de tinta à volta. -->
