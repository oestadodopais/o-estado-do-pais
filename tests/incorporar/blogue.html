<!doctype html>
<html lang="{{lang}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{titulo}}</title>

body{font:18px/1.6 Georgia,serif;max-width:42em;margin:32px auto;padding:0 18px;color:#202124}
h1{font-size:32px}h2{font-size:20px}section{border-top:1px solid #aaa;margin-top:32px}
a{color:inherit;text-decoration:underline}p{overflow-wrap:anywhere}
</style>
<h1>{{titulo}}</h1>
<p id="anfitria">{{anfitria}}</p>
<section id="caso-atual"><h2>{{rotulo_atual}}</h2>{{codigo_atual}}</section>
<section id="caso-antigo"><h2>{{rotulo_antigo}}</h2>{{codigo_antigo}}</section>
<section id="caso-ausente"><h2>{{rotulo_ausente}}</h2>{{codigo_ausente}}</section>
</html>
