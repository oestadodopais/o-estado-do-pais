  # Dupla grafia: o vocabulário regista as duas formas, porque a consoante é
  # proferida por uns e não por outros. A casa escreve uma só, e escreve a do
  # Acordo. Ver IDENTIDADE.md §9.
  - anterior: 'aspecto'
    acordo: 'aspeto'
    fonte: 'https://voc.cplp.org/'
    nota: >-
      O vocabulário de Portugal regista «aspeto» e não regista «aspecto». Priberam
      chama-lhe dupla grafia («aspeto ou aspecto»); a forma que o vocabulário
      atesta é «aspeto», e é a que a casa escreve.
  - anterior: 'aspectos'
    acordo: 'aspetos'
    fonte: 'https://voc.cplp.org/'
    nota: 'Como «aspecto».'
  - anterior: 'sector'
    acordo: 'setor'
    fonte: 'https://voc.cplp.org/'
    nota: >-
      Dupla grafia a sério: o vocabulário regista «setor» E «sector». A casa
      escreve «setor», que é a forma do Acordo. Não ocorre hoje no repositório;
      está aqui para que a primeira ocorrência não fique ao critério de quem a
      escrever.
  - anterior: 'sectores'
    acordo: 'setores'
    fonte: 'https://voc.cplp.org/'
    nota: 'Como «sector»: as duas constam, a casa escreve «setores».'
  - anterior: 'sectorial'
    acordo: 'setorial'
    fonte: 'https://voc.cplp.org/'
    nota: 'Como «sector»: as duas constam, a casa escreve «setorial».'

  # -------------------------------------------------------------------------
  # 2. O acento que deixa de se escrever.
  #    Acordo, Base IX, 3 (ditongo tónico oi de palavras graves) e Base IX, 7
  #    (circunflexo na terminação -em da 3.ª pessoa do plural).
  #    A pesquisa do vocabulário não distingue diacríticos, por isso estes pares
  #    não se provam por ela: provam-se pelo texto do Acordo, que os nomeia.
  # -------------------------------------------------------------------------
  - anterior: 'crêem'
    acordo: 'creem'
    fonte: 'http://www.portaldalinguaportuguesa.org/acordo.php?action=acordo&version=1990'
    nota: >-
      Base IX, 7: «Prescinde-se de acento circunflexo nas formas verbais
      paroxítonas que contêm um e tónico oral fechado em hiato com a terminação
      -em da 3ª pessoa do plural do presente do indicativo ou do conjuntivo:
      creem, deem, descreem, leem, preveem, releem, reveem, veem.»
  - { anterior: 'dêem', acordo: 'deem', nota: 'Base IX, 7, como «crêem».' }
  - { anterior: 'lêem', acordo: 'leem', nota: 'Base IX, 7, como «crêem».' }
  - { anterior: 'vêem', acordo: 'veem', nota: 'Base IX, 7, como «crêem».' }
  - anterior: 'jóia'
    acordo: 'joia'
    fonte: 'http://www.portaldalinguaportuguesa.org/acordo.php?action=acordo&version=1990'
    nota: >-
      Base IX, 3: os ditongos tónicos oi das palavras graves deixam de levar
      acento agudo. O texto nomeia «heroico» e «paranoico» na mesma lista.
  - { anterior: 'jóias', acordo: 'joias', nota: 'Base IX, 3, como «jóia».' }
  - { anterior: 'heróico', acordo: 'heroico', nota: 'Base IX, 3, nomeado no texto.' }
  - { anterior: 'heróica', acordo: 'heroica', nota: 'Base IX, 3, como «heróico».' }

  # -------------------------------------------------------------------------
  # 3. A maiúscula que passa a minúscula.
  #    Acordo, Base XIX, 1 b): «A letra minúscula inicial é usada nos nomes dos
  #    dias, meses, estações do ano: segunda-feira; outubro; primavera.»
  #    «caso: fixo» — não há preservação de caixa: o par É a caixa.
  #    «guarda: inicio-de-frase» — um mês no princípio de uma frase leva
  #    maiúscula por ser princípio de frase, e a ferramenta não lhe toca.
  # -------------------------------------------------------------------------
  - anterior: 'Janeiro'
    acordo: 'janeiro'
    caso: fixo
    guarda: inicio-de-frase
    fonte: 'http://www.portaldalinguaportuguesa.org/acordo.php?action=acordo&version=1990'
    nota: 'Base XIX, 1 b). Vale para os doze meses e para os dias da semana.'
  - { anterior: 'Fevereiro', acordo: 'fevereiro', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Março', acordo: 'março', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Abril', acordo: 'abril', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Maio', acordo: 'maio', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Junho', acordo: 'junho', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Julho', acordo: 'julho', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Agosto', acordo: 'agosto', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Setembro', acordo: 'setembro', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Outubro', acordo: 'outubro', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Novembro', acordo: 'novembro', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Dezembro', acordo: 'dezembro', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Segunda-feira', acordo: 'segunda-feira', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Terça-feira', acordo: 'terça-feira', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Quarta-feira', acordo: 'quarta-feira', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Quinta-feira', acordo: 'quinta-feira', caso: fixo, guarda: inicio-de-frase }
  - { anterior: 'Sexta-feira', acordo: 'sexta-feira', caso: fixo, guarda: inicio-de-frase }

  # -------------------------------------------------------------------------
  # 4. O hífen que cai.
  #    Acordo, Base XVI. Formas consultadas uma a uma no vocabulário.
  # -------------------------------------------------------------------------
  - { anterior: 'contra-ordenação', acordo: 'contraordenação' }
  - { anterior: 'contra-ordenações', acordo: 'contraordenações' }
  - { anterior: 'co-autor', acordo: 'coautor' }
  - { anterior: 'co-autores', acordo: 'coautores' }
  - { anterior: 'co-autoria', acordo: 'coautoria' }
  - { anterior: 'auto-avaliação', acordo: 'autoavaliação' }
  - anterior: 'auto-contido'
    acordo: 'autocontido'
    fonte: 'http://www.portaldalinguaportuguesa.org/acordo.php?action=acordo&version=1990'
    nota: >-
      Nenhuma das duas formas consta do vocabulário: é termo técnico. O par vem
      da regra e não do léxico. Base XVI: com o prefixo «auto» não se emprega
      hífen quando o segundo elemento começa por consoante diferente
      («autoestrada», «autoaprendizagem» são os exemplos do texto).
  - { anterior: 'auto-contida', acordo: 'autocontida', nota: 'Como «auto-contido».' }

# -----------------------------------------------------------------------------
# Só se assinalam. O sentido inverso destas trocas é ambíguo: de «para» não se
# pode saber se veio de «pára» ou se sempre foi a preposição. Uma conversão que
# não se pode desfazer não é reversível, e a reversibilidade é a razão de haver
# aqui uma lista em vez de uma passagem de um só sentido. Reescrevem-se à mão,
# como os travessões.
#
# Acordo, Base IX, 9: os acentos que só serviam para distinguir homógrafos
# deixam de se escrever. O Portal da Língua Portuguesa resume-o assim:
# «escreve-se agora pelo e não pêlo, pela e não péla, para e não pára».
# -----------------------------------------------------------------------------
manuais:
  - { anterior: 'pára', acordo: 'para' }
  - { anterior: 'pêlo', acordo: 'pelo' }
  - { anterior: 'pêlos', acordo: 'pelos' }
  # Só a forma minúscula: «Castanheira de Pêra» é um dos 308 concelhos, e um
  # topónimo escreve-se como o seu dono o escreve. Uma «Pêra» com maiúscula no
  # princípio de uma frase fica por assinalar, e é o preço deste par.
  - { anterior: 'pêra', acordo: 'pera', caso: fixo }
  - { anterior: 'pólo', acordo: 'polo' }
  - { anterior: 'pólos', acordo: 'polos' }
  - { anterior: 'péla', acordo: 'pela' }

# -----------------------------------------------------------------------------
# Parecem anteriores ao Acordo e são a forma certa em Portugal: a consoante
# pronuncia-se, e por isso escreve-se (Acordo, Base IV, 1 a): «conservam-se nos
