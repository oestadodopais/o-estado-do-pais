# =============================================================================
# As formas, e o sentido em que se convertem.
#
# Uma lista, dois consumidores: `scripts/ortografia.mjs` converte por ela, e
# `scripts/gate-html.mjs` confere por ela o texto renderizado. Se houvesse duas
# listas, uma delas ficaria para trás.
#
# A regra que esta lista serve está em IDENTIDADE.md §9: a superfície pública
# do sítio segue o Acordo Ortográfico de 1990 tal como é aplicado em Portugal.
# O que é transcrito nunca se converte. Os documentos do repositório
# (DECISIONS.md, IDENTIDADE.md, README.md, PLANO-*.md, BRIEF-*.md, VOZ-*.md)
# são registo e ficam na grafia em que foram escritos.
#
# TRÊS LISTAS:
#   pares    — convertem-se por máquina, nos dois sentidos.
#   manuais  — só se assinalam. O sentido inverso é ambíguo (de «para» não se
#              sabe se veio de «pára»), e uma conversão que não se pode desfazer
#              não é reversível. Reescrevem-se à mão, como os travessões.
#   iguais   — parecem anteriores ao Acordo e são a forma certa em Portugal.
#              Estão aqui para que a conferência não dispare sobre elas, e para
#              que ninguém as «corrija».
#
# COMO SE ACRESCENTA UMA FORMA: consulte-a no vocabulário abaixo, forma a forma
# (a flexão que vai usar, não o infinitivo). Se a forma anterior não constar e a
# do Acordo constar, é um par. Se constarem as duas, é dupla grafia: escolha a
# forma do Acordo e escreva porquê em «nota». Nunca deduza uma flexão: escreva-a.
# =============================================================================

autoridade:
  vocabulario: >-
    Vocabulário Ortográfico Comum da Língua Portuguesa, na versão VOP
    (Vocabulário Ortográfico do Português, 2.ª edição), que é a versão de
    Portugal.
  vocabulario_url: 'https://voc.cplp.org/'
  texto_do_acordo: 'Acordo Ortográfico da Língua Portuguesa (1990), texto integral'
  texto_do_acordo_url: 'http://www.portaldalinguaportuguesa.org/acordo.php?action=acordo&version=1990'
  segunda_opiniao_url: 'https://dicionario.priberam.org/'
  consultado: '2026-08-16'
  como: >-
    Cada par de consoante foi consultado forma a forma no vocabulário: a forma
    anterior não consta, a forma do Acordo consta. Onde constam as duas, é
    dupla grafia, e o par leva nota. A pesquisa do vocabulário não distingue
    diacríticos, e por isso os pares de acento e os de maiúscula não se podem
    provar por ela: citam a base do próprio Acordo.

