# Manifesto dos documentos alojados
#
# Uma linha por edição instalada em studies-src/<slug>/<lingua>.html.
# É contra este ficheiro que `npm run check:documentos` confere, a cada
# construção, os bytes que estão em disco.
#
# COMO SE PRODUZ UMA LINHA (dois passos, e nenhum à mão):
#   1. descarregar o artefacto e guardar os bytes em _raw/<slug>.<lingua>.html;
#   2. node scripts/normalize-study.mjs _raw/<slug>.<lingua>.html <slug>/<lingua>.html
#      — a saída imprime os dois resumos e as três medidas desta linha.
#
# OS DOIS RESUMOS NÃO TÊM O MESMO ESTATUTO, e é deliberado:
#
#   sha256_raw         NÃO É REPRODUZÍVEL. É o registo honesto dos bytes que o
#                      anfitrião serviu naquele instante. O runtime que ele
#                      injecta muda sozinho, sem o documento mudar: entre
#                      2026-08-10 e 2026-08-12 passou de 14 571 para 17 141
#                      bytes, e três destes artefactos mudaram de resumo bruto
#                      sem que o autor lhes tocasse. Quem reconferir por
#                      descarga nova deve esperar que este valor DIVIRJA.
#   sha256_normalized  É O INVARIANTE. O mesmo documento do autor dá sempre o
#                      mesmo resumo, porque a normalização retira exactamente o
#                      runtime e mais nada. É este que o portão confere, e é
#                      este que uma verificação independente deve reproduzir.
#
# Os ficheiros de _raw/ estão versionados de propósito: sem eles, sha256_raw
# seria uma afirmação sobre bytes que já não existem em lado nenhum, e a função
# de normalização deixaria de poder ser reexecutada sem rede.
#
# fetched_utc é o instante em que os bytes foram escritos em studies-src/. Para
# um artefacto, é o instante em que a ferramenta de descarga os escreveu; para
# um documento que atravessou de outro sistema desta casa, é o instante da
# cópia. Não é a data de publicação do documento — essa vive no arquivo,
# src/data/studies.mjs.
#
# DOIS CAMINHOS DE PROVENIÊNCIA, e um documento declara um deles:
#
#   artifact_url        o documento foi servido por um anfitrião externo
#                       (claude.ai). Foi o único caso até 2026-08-15.
#   origin + origin_ref o documento veio de outro sistema desta casa. Hoje há
#                       um sistema, `researchhub`, e `origin_ref` diz o
#                       ficheiro e o commit de onde os bytes saíram.
#
# Um documento sem nenhum dos dois pára o build. Ver DECISIONS §1.31.
#
# NUM DOCUMENTO QUE NUNCA FOI EMBRULHADO, os dois resumos são iguais, e isso é
# a afirmação certa e não uma folga: não houve runtime para retirar, o
# normalizador não correu, e `bytes_runtime_removed` não aparece porque nada
# foi removido. Os bytes brutos SÃO os bytes alojados.
#
# via  — campo opcional, e só aparece quando os bytes NÃO vieram de um ficheiro
#        escrito pela ferramenta de descarga. Hoje há um caso, e um só:
#        `transcript-extraction`, em que a descarga devolveu o artefacto em
#        linha, sem escrever ficheiro, e os bytes foram recuperados do registo
#        da sessão por um analisador puro — com o comprimento conferido contra a
#        contagem que o próprio arranês registou da resposta HTTP. O caminho, as
#        cinco conferências e o porquê estão em DECISIONS §1.21 e em
#        scripts/extract-from-transcript.mjs. O portão nomeia estas linhas em
#        voz alta a cada construção.

