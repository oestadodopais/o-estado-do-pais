# Excerto textual da fonte, palavra por palavra. Nunca uma paráfrase.
excerpt: "A evolução dos preços da energia poderá originar pressões adicionais sobre a despesa pública e a receita. O prolongamento das tensões geopolíticas poderá manter a inflação acima do pressuposto no cenário orçamental (que aponta para um nível 0,6 p.p. inferior ao estimado para 2026) e justificar a adoção ou prorrogação de medidas de apoio às famílias e às empresas. A 16 de outubro, o Brent cotava cerca de 110 USD por barril e a média dos contratos de 2027 era de cerca de 95 USD, 11% acima dos 86,1 USD assumidos pelo MF (Capítulo 2). O efeito de uma inflação mais elevada sobre a receita é tratado nos riscos ascendentes. A Caixa 2 descreve o choque energético de 2026 e as respostas orçamentais na União Europeia e em Portugal."

