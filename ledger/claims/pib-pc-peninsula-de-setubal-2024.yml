study: "avaliacao-economica-regional-de-portugal-2026"
note: "Índice do PIB per capita em PPS, UE-27 = 100, tal como o Eurostat o publica (arredondado à unidade). Código NUTS confirmado contra as etiquetas da própria resposta do Eurostat: PT1B = Península de Setúbal. Proveniência preenchida a 2026-08-13, contra a fonte primária. O Eurostat marca este valor como provisório (bandeira «p»). Os dados regionais de 2024 são a primeira publicação do ano de referência: transmissão a T+12 meses e divulgação entre 1 e 15 de fevereiro (ESMS reg_eco10 §14.1, §8.1). O Eurostat reajusta os valores regionais ao PIB nacional uma vez por ano (§18.6), ao passo que o nacional é revisto ao longo do ano, sobretudo entre maio e outubro (§15.3) — pelo que se espera que este número mude na divulgação de fevereiro de 2027. Valor reconferido a 2026-08-13 por extração independente em duas vias — API JSON-stat e ficheiro SDMX-TSV — por quem não escreveu a linha; ambas devolveram o mesmo valor, a mesma etiqueta de região e a mesma data de atualização do conjunto (2026-02-10)."

