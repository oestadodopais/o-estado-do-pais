excerpt: "PIB                                                       1,9       2,3      2,1\n\nFonte: MF – Informação enviada a 30 de setembro de 2026.\n\nNo ano de 2027, o crescimento real previsto de 2,1% é superior ao de todas as instituições de referência e encontra-se no limite superior do intervalo de confiança a 30% dessas previsões e projeções.\n\nNos termos do número 4do artigo 4.º do Regulamento n.º 473/2013 do Parlamento Europeu e do Conselho de 21 de maio de 2013, em resultado da análise efetuada às previsões macroeconómicas subjacentes à Proposta de Orçamento do Estado para 2027 do XXV Governo Constitucional, com base na informação atualmente disponível e ponderando os riscos identificados, tendo em conta que a evolução para o crescimento nominal previsto para 2027 respeita os princípios legais supramencionados, o Conselho das Finanças Públicas endossa as previsões macroeconómicas apresentadas, dando nota que os riscos para o crescimento real apresentam um pendor descendente."

