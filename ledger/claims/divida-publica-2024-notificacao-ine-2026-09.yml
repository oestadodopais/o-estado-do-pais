note: "[note do motor] Segunda notificação de 2026 do Procedimento dos Défices Excessivos, que o INE envia ao Eurostat e publicou a 23.09.2026 no destaque «Procedimento dos Défices Excessivos 2ª Notificação»; resultados provisórios, como o próprio destaque diz («De acordo com os resultados provisórios obtidos neste exercício»). Segundo o mesmo destaque, para 2025 e anos anteriores a capacidade ou necessidade líquida de financiamento é compilada pelo INE e a dívida bruta pelo Banco de Portugal. Lido no primeiro parágrafo do «Resumo» da página do destaque; a mesma frase está na p. 1 do PDF do destaque (linhas 13 a 15 da extração por pdftotext -layout), cuja camada de texto não traz as letras maiúsculas A e U, e os valores são os mesmos nas duas leituras. Esta linha não substitui a do quadro do Eurostat (divida-publica-2025 e saldo-das-administracoes-publicas-2025), que é a linha de registo e só muda quando o Eurostat publicar a notificação de outubro (21.10.2026 no calendário das fontes): é a decisão da §1.124 do registo do sítio, cada notificação nacional entra como linha própria, datada, ao lado. Licença: não lida para este destaque. · Cruzado de ResearchHub content/13 Dominios · divida-publica-2024-notificacao-ine-2026-09."

