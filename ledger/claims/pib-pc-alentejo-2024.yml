note: "Índice do PIB per capita em PPS, UE-27 = 100, tal como o Eurostat o publica (arredondado à unidade). Código NUTS confirmado contra as etiquetas da própria resposta do Eurostat: PT1C = Alentejo. Até 2026-08-13 esta linha era derivada e publicava uma casa decimal calculada sobre os valores absolutos; ver a correcção abaixo e DECISIONS §1.28. Valor reconferido a 2026-08-13 por extracção independente em duas vias — API JSON-stat e ficheiro SDMX-TSV — por quem não escreveu a linha."

# Correcções datadas. Nunca apagar um valor: acrescentar aqui.
corrections:
  - date: "2026-08-13"
    kind: "correcao"
    old_value: "77,2"
    new_value: "77"
    reason: "O valor publicado trazia uma casa decimal que a fonte não sustenta. Era calculado a partir dos valores absolutos em paridades de poder de compra; o Eurostat publica este índice arredondado à unidade — 77 — e marca o valor de 2024 como provisório. Publicar um décimo de ponto sobre um número que a fonte espera rever afirmava uma precisão que não existe. Passa a publicar-se o índice tal como a fonte o publica."
    reason_en: "The published value carried a decimal the source does not support. It was computed from the absolute purchasing-power-standard values; Eurostat publishes this index rounded to the unit — 77 — and marks the 2024 value provisional. Publishing a tenth of a point on a number the source expects to revise asserted a precision that does not exist. The index is now published as the source publishes it."
