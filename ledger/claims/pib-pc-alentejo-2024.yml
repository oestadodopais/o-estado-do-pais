source_flag_note: "O Eurostat marca este valor como provisório. Os dados regionais de 2024 são a primeira publicação do ano de referência, e o Eurostat reajusta os valores regionais ao PIB nacional uma vez por ano, enquanto o nacional é revisto ao longo do ano — pelo que se espera que este número mude na divulgação de Fevereiro de 2027."
source_flag_note_en: "Eurostat marks this value as provisional. The 2024 regional data is the first release of the reference year, and Eurostat re-benchmarks regional values to national GDP once a year, while the national figures are revised throughout the year — so this number is expected to change at the February 2027 release."

