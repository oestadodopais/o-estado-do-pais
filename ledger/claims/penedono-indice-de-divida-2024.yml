# null quando o valor é publicado; a aritmética explicada quando é calculado.
derivation: "N.d. ÷ N.d. × 150 = N.d.. A DGAL não publicou a dívida nem o limite deste município em 2024, por isso o índice não é calculado: herda a cadeia de caracteres impressa nos dois termos. O limite legal é 1,5 vezes a média da receita corrente líquida dos três anos anteriores (art. 52.º da Lei n.º 73/2013), e o índice mede a dívida contra esse limite numa escala em que o teto é 150."
derivation_en: "N.d. ÷ N.d. × 150 = N.d.. The DGAL published neither the debt nor the ceiling of this municipality for 2024, so the index is not computed: it inherits the characters printed in both terms. The legal ceiling is 1.5 times the three-year average of net current revenue (art. 52.º, Lei n.º 73/2013), and the index measures debt against that ceiling on a scale whose cap is 150."
