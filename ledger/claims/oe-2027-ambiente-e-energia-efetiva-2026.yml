# Excerto textual da fonte, palavra por palavra. Nunca uma paráfrase.
excerpt: "A Missão de Base Orgânica Ambiente e Energia evidencia, no orçamento para 2027, uma\ndotação de despesa total consolidada de 2265,2 milhões de euros. Excluído o efeito da\ndespesa relativa ao Plano de Recuperação e Resiliência (PRR), a dotação de despesa total\nconsolidada ascende a 1751,5 milhões de euros, o que representa um aumento de 15,4% face\nà estimativa para 2026. A despesa efetiva consolidada ascende a 2235,2 milhões de euros.\nExcluído o efeito da despesa relativa ao PRR, a dotação de despesa efetiva consolidada\nascende a 1721,5 milhões de euros, excedendo em 17,3% a estimativa para 2026 sem PRR,\nconforme demonstrado no quadro da Conta do Programa Legado, que evidencia\nigualmente a distribuição da despesa por natureza e fonte de financiamento.\n Despesa efetiva consolidada                           2 290,4             1 467,2       2 235,2            1 721,5         -2,4          17,3\nSeleção: 2026 Estimativa"

