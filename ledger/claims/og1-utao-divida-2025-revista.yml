# Excerto textual da fonte, palavra por palavra. Nunca uma paráfrase.
excerpt: "A POE/2027 prevê a continuação da redução do rácio da dívida pública, para 87,5% do PIB em 2026 e 84,5% em 2027. Segundo o Ministério das Finanças, as reduções anuais deverão atingir 1,6 p.p. e 3,0 p.p., respetivamente. A estimativa para 2026 mantém o nível previsto no RAP/2026, embora o rácio de 2025 tenha sido revisto de 89,7% para 89,2%, pelo que a descida anual (1,6 p.p.) é inferior à implícita naquele exercício (de 89,7% para 87,5%). Face ao POENMP, os rácios agora projetados situam-se 2,9 p.p. abaixo em 2026 e 2,7 p.p. em 2027. Estas diferenças refletem, contudo, revisões da base estatística e do cenário macroeconómico e orçamental subjacente às projeções, não podendo ser integralmente atribuídas a um maior esforço orçamental."

