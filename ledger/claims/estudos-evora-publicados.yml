derivation: "Contagem dos trabalhos do arquivo cujo objeto é o município de Évora e a que nenhum outro estudo sucedeu: «As contas da Câmara de Évora, 2010 a 2025: o orçamento, a cobrança, a dívida e a certificação», «Quem governou a Câmara de Évora, 2009 a 2025: as eleições, os executivos, os pelouros e as decisões», «A economia de Évora e o dinheiro público que chega ao concelho por fora da câmara» e «Évora 2027, Capital Europeia da Cultura: o que a candidatura prometeu, o que o painel europeu escreveu e o dinheiro nos atos públicos». Os seis estudos de Évora de agosto e setembro de 2026 a que estes quatro sucedem ficam alojados como edições datadas e não contam. As edições inglesas do primeiro, do terceiro e do quarto são traduções do mesmo trabalho, não estudos à parte."
derivation_en: "Count of the works in the archive whose subject is the municipality of Évora and that no other study has succeeded: «The accounts of the Câmara de Évora, 2010 to 2025: the budget, what was collected, the debt and the certification», «Quem governou a Câmara de Évora, 2009 a 2025: as eleições, os executivos, os pelouros e as decisões», «The economy of Évora and the public money that reaches the municipality outside the council» and «Évora 2027, European Capital of Culture: what the bid promised, what the European panel wrote and the money in the official acts». The six Évora studies of August and September 2026 that these four succeed stay hosted as dated editions and do not count. The English editions of the first, the third and the fourth are translations of the same work, not studies in their own right."
