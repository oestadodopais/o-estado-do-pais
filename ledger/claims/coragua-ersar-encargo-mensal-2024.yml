excerpt: |-
  Em Portugal continental, entre 2015 e 2024, o nível médio de encargos tarifários mensais suportado pelo utilizador final para um
  consumo de 10 metros cúbicos, apresenta a evolução, a preços correntes, que se pode verificar na Figura 553⁸⁷.




                  Figura 553. Evolução do nível médio de encargos tarifários mensais por serviço entre 2015 e 2024

  Em 2022, há uma quebra de série na medida em que os valores apresentados passaram a incluir o IVA e a repercussão dos gastos com as taxas ambientais (Taxa de Recursos Hídricos e Taxa de Gestão de Resíduos).
