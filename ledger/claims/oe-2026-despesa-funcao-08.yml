# Ressalva publicada da casa, conferida no motor, nas duas línguas.
ressalva: "O ficheiro da fonte não imprime a unidade; a escala em milhões de euros foi conferida com a receita, a despesa e o saldo da síntese de julho, em seis correspondências exatas. A despesa efetiva consolidada exclui ativos e passivos financeiros e operações extraorçamentais. A soma das funções exige a diferença de consolidação e pode diferir do total pelo arredondamento da fonte. Os mapas e a execução orçamental usam contabilidade pública e o perímetro indicado no nome. O Eurostat usa contabilidade nacional e inclui também as administrações regional e local. Estas grandezas não são diretamente comparáveis."
ressalva_en: "The source file does not print the unit; the scale in million euros was checked against revenue, expenditure and the balance in the July summary, with six exact matches. Consolidated effective expenditure excludes financial assets and liabilities and extrabudgetary transactions. Adding the functions requires the consolidation difference and may differ from the total because of rounding in the source. The budget maps and budget execution use public budget accounting and the scope stated in the name. Eurostat uses national accounts and also includes regional and local government. These measures are not directly comparable."

