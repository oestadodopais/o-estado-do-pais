excerpt: "B5: ANEXOS ESTATÍSTICOS; B6: Agosto de 2026; B8: Quadro 19 - Dívida não Financeira das Administrações Públicas; C39: Pagamentos em atraso - Stock em fim de período (consolidado); Q38: € Milhões; C45: Unidades de Saúde EPE; I40: 2026; P41: ago*; C54: A partir de junho de 2026, na sequência alteração da Lei dos Compromissos e Pagamentos em Atraso (LCPA) pela Lei n.º 24/2026, de 1 de junho, os pagamentos em atraso passaram a corresponder às contas a pagar não liquidadas para além dos prazos legalmente aplicáveis de 30 dias, em regra para entidades públicas, ou de 60 dias para as entidades que integram o Serviço Nacional de Saúde e outros casos legalmente previstos. A redação anterior da LCPA estabelecia que constituíam pagamentos em atraso as contas a pagar que permanecessem nessa situação mais de 90 dias após a data acordada.; C89: Com a entrada em vigor, em 2024, do novo modelo organizativo do Serviço Nacional de Saúde (Decreto-Lei n.º 102/2023, de 7 de novembro), a designação apresentada no quadro foi adaptada de Hospitais EPE para Unidades de Saúde EPE e passa a incluir igualmente os Hospitais do Sector Público Administrativo, os Agrupamentos de Centros de Saúde e os Centros de Saúde, entidades anteriormente integradas no subsetor da saúde.; P45: 689,9"

# Ressalva publicada da casa, conferida no motor, nas duas línguas.
ressalva: "Definição da DGO, aplicável desde junho de 2026, na nota do quadro de agosto de 2026: «A partir de junho de 2026, na sequência alteração da Lei dos Compromissos e Pagamentos em Atraso (LCPA) pela Lei n.º 24/2026, de 1 de junho, os pagamentos em atraso passaram a corresponder às contas a pagar não liquidadas para além dos prazos legalmente aplicáveis de 30 dias, em regra para entidades públicas, ou de 60 dias para as entidades que integram o Serviço Nacional de Saúde e outros casos legalmente previstos. A redação anterior da LCPA estabelecia que constituíam pagamentos em atraso as contas a pagar que permanecessem nessa situação mais de 90 dias após a data acordada.»"
ressalva_en: "DGO definition, applicable since June 2026, in the August 2026 table note: «A partir de junho de 2026, na sequência alteração da Lei dos Compromissos e Pagamentos em Atraso (LCPA) pela Lei n.º 24/2026, de 1 de junho, os pagamentos em atraso passaram a corresponder às contas a pagar não liquidadas para além dos prazos legalmente aplicáveis de 30 dias, em regra para entidades públicas, ou de 60 dias para as entidades que integram o Serviço Nacional de Saúde e outros casos legalmente previstos. A redação anterior da LCPA estabelecia que constituíam pagamentos em atraso as contas a pagar que permanecessem nessa situação mais de 90 dias após a data acordada.»"

