# O valor tal como é publicado, com formatação portuguesa. String, nunca número.
value: "Do conjunto de alterações, destaca-se a aplicação, com carácter temporário, da taxa reduzida de IVA de 6 % às empreitadas de construção e reabilitação de imóveis para habitação, a redução das taxas de imposto sobre o rendimento das pessoas singulares (IRS) e de imposto sobre o rendimento das pessoas coletivas (IRC) aplicáveis a rendimentos prediais decorrentes de contratos de arrendamento destinados exclusivamente ao arrendamento para habitação, incluindo contratos de arrendamento já em curso, bem como a exclusão de tributação, em sede de IRS, das mais-valias imobiliárias quando haja reinvestimento em imóveis destinados ao arrendamento para habitação, com vista a reforçar o investimento e a disponibilização de oferta habitacional."
