excerpt: 'Não medidoO número da agricultura é um modelo, não uma medição. O PGRH calcula-o como área regada × coeficiente cultural ÷ eficiência de transporte. 71% dos agricultores não têm contador de água — valor de um inquérito Gulbenkian/Ipsos a cerca de 490 explorações (2021), não do Recenseamento Agrícola do INE, que não contém esta estatística (atribuição corrigida a 29 de julho de 2026). Os setores que são medidos — urbano e indústria, a partir de declarações fiscais — concordam entre fontes dentro de 2,5% onde a comparação foi possível. A agricultura não: no Guadiana, o volume declarado para a taxa de recursos hídricos é 62% inferior ao modelado no PGRH, e entre ciclos de planeamento as diferenças regionais chegam a +98%.'
