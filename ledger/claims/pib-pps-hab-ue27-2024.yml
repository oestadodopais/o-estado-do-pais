note: "PIB per capita em paridades de poder de compra, valor absoluto. Serviu de origem ao índice do Alentejo enquanto a casa o publicou com uma casa decimal; desde 2026-08-13 o índice publica-se como o Eurostat o publica, arredondado à unidade, e esta linha fica pelo seu próprio valor. O código NUTS foi confirmado contra as etiquetas da própria resposta do Eurostat: EU27_2020 = União Europeia (27). O Eurostat NÃO marca esta célula como provisória, ao contrário de todas as células portuguesas de 2024 do mesmo conjunto. A assimetria foi confirmada nas duas vias de extracção; a documentação consultada não a explica, e a casa não lhe atribui razão. Valor reconferido a 2026-08-13 por extracção independente em duas vias — API JSON-stat e ficheiro SDMX-TSV — por quem não escreveu a linha; ambas devolveram o mesmo valor, a mesma etiqueta de região e a mesma data de actualização do conjunto (2026-02-10)."

