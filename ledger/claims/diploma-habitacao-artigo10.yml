excerpt: "Artigo 10.º Regime aplicável à verba 2.42.1 da lista I anexa ao Código do Imposto sobre o Valor Acrescentado 1 — Podem beneficiar da aplicação da verba 2.42.1 da lista I anexa ao Código do IVA as empreitadas de construção ou reabilitação de imóveis que se destinem à venda para habitação própria e permanente do adquirente ou de imóveis que se destinem exclusivamente ao arrendamento habitacional, desde que: a) No caso de venda para habitação própria e permanente do adquirente, se verifiquem, cumulativamente, as seguintes condições: i) O imóvel seja vendido para habitação própria e permanente do adquirente e na aquisição se apliquem as taxas previstas nas alíneas a) ou b) do n.º 1 do artigo 17.º do Código do IMT; ii) A venda ocorra no prazo máximo de 24 meses a contar da data da emissão da documentação relativa ao início de utilização, nos termos do Regime Jurídico da Urbanização e Edificação (RJUE), aprovado pelo Decreto-Lei n.º 555/99, de 16 de dezembro; iii) Seja feita menção expressa, no título aquisitivo, à aplicação da taxa prevista na verba 2.42.1 da lista I anexa ao Código do IVA; b) No caso de arrendamento habitacional, se verifiquem, cumulativamente, as seguintes condições: i) O arrendamento seja isento nos termos do artigo 9.º do Código do IVA; ii) Os contratos de arrendamento sejam comunicados nos termos do artigo 60.º do Código de Imposto do Selo; iii) O primeiro contrato de arrendamento habitacional entre em vigor no prazo máximo de 24 meses a contar da data da emissão da documentação relativa ao início de utilização, nos termos do RJUE; iv) O imóvel seja objeto de contratos de arrendamento habitacional em vigor, em pelo menos 36 meses, seguidos ou interpolados, durante os primeiros cinco anos após a emissão da documentação relativa ao início de utilização, nos termos do RJUE; v) Não seja convencionada a possibilidade de subarrendamento por montante superior ao previsto na alínea b) do n.º 2 do artigo 2.º 2 — No caso de imóvel adquirido em regime de compropriedade ou de comunhão, a verba 2.42.1 só é aplicável quando, verificadas as demais condições, todos os comproprietários o afetem a habitação permanente. 3 — Tratando-se de imóvel em regime de propriedade horizontal, a verba 2.42.1 só é aplicável à parte da empreitada proporcional à área bruta de construção do edifício ou das frações e à área excedente à de implantação (A), tal como definida nos termos do artigo 40.º do Código do IMI, a afetar a habitação, correspondente às frações relativamente as quais se verifiquem as condições previstas naquela verba e nos números anteriores, consoante se destinem a venda ou arrendamento. 4 — Aos imóveis compostos por andares ou divisões suscetíveis de utilização independente, que não estejam constituídos em regime de propriedade horizontal, aplica-se o disposto no número anterior, com as necessárias adaptações. 5 — Sem prejuízo do disposto no n.º 8 do artigo 11.º do Código do IMT, sempre que o imóvel não seja afeto, no prazo de seis meses a contar da data da aquisição, a habitação própria e permanente do sujeito passivo, comprovada através do respetivo domicílio fiscal, ou não seja destinado exclusivamente a habitação própria e permanente do sujeito passivo, comprovada através do respetivo domicílio fiscal, nos 12 meses posteriores à afetação, aplica-se um agravamento do IMT correspondente a 10 % sobre o valor tributável determinado nos termos do artigo 12.º do Código do IMT. 6 — O disposto no número anterior não é aplicável quando a não afetação a habitação própria e permanente, ou a inobservância do período referido no n.º 5, resulte de circunstâncias excecionais, nos termos do n.º 26 do artigo 10.º do Código do IRS. 7 — A verba 2.42.1 cessa a sua vigência a 31 de dezembro de 2032."

