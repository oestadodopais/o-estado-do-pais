# O valor tal como é publicado, com formatação portuguesa. String, nunca número.
value: "c) Verificação das condições do direito à reposição do equilíbrio financeiro do contrato e a negociação dos termos da eventual reposição desse equilíbrio, designadamente no que se refere: i) à implementação, através da publicação do Decreto-Lei n.º 71/2018, de 5 de setembro, das propostas do Grupo de Trabalho informal para a “Eventual Revisão do Sistema de Classificação de Veículos Ligeiros (Classes 1 e 2) para efeitos de Aplicação de Taxas de Portagem”, nos termos do Protocolo assinado em 9 de agosto de 2018 entre o IMT, I. P., e a BRISA; ii) à implementação do Decreto-Lei n.º 120/2021, de 24 de dezembro (que alterou o Decreto-Lei n.º 71/2018, de 5 de setembro), relativo à reclassificação em classe 1 dos veículos elétricos e híbridos dotados de tração aos dois eixos; iii. à atribuição de isenções de pagamento de taxas de portagem (aos veículos da Polícia Judiciária e aos veículos dedicados ao transporte de doentes); iv. à implementação do Decreto-Lei n.º 87-A/22, de 19 de dezembro (que aprovou o regime excecional de atualização das tarifas e taxas de portagem para o ano de 2023);"
