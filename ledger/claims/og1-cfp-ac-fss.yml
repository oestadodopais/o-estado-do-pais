id: "og1-cfp-ac-fss"

# O valor tal como é publicado, com formatação portuguesa. String, nunca número.
value: "A POE/2027 prevê um novo agravamento do défice da Administração Central, para 2,8% do PIB, o mais elevado desde 2017, excluindo o período pandémico. Tal como no ano anterior, este agravamento é compensado sobretudo pelo excedente dos Fundos da Segurança Social (FSS), e em menor medida pelo excedente da Administração Regional e Local. Contudo, ao contrário do que se verificou em 2025, o excedente dos FSS não é suficiente para compensar integralmente o défice da Administração Central. Mantém-se, assim, a dependência do desempenho orçamental em relação ao subsector dos FSS, um subsector particularmente exposto às contingências do ciclo económico."
