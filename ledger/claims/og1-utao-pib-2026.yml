# Excerto textual da fonte, palavra por palavra. Nunca uma paráfrase.
excerpt: "A POE/2027 prevê um crescimento real do PIB de 2,1% em 2027, ligeiramente inferior aos 2,3% estimados para 2026, com o menor contributo da procura interna parcialmente compensado pela melhoria do contributo das exportações líquidas. O consumo privado, o consumo público e o investimento deverão crescer a um ritmo mais moderado, sendo o abrandamento mais acentuado no investimento. O MF associa esta evolução à conclusão do PRR e ao menor impacto das aquisições de equipamento que impulsionaram o investimento em 2026, admitindo ainda uma compensação parcial pela execução dos restantes fundos europeus e pelo investimento direto estrangeiro. No setor externo, o MF prevê que as exportações abrandem, apesar da aceleração da procura externa dirigida à economia portuguesa. O cenário aponta, assim, para um crescimento das exportações próximo do dos mercados de destino em 2027, após os ganhos de quota implícitos em 2026. A melhoria do contributo das exportações líquidas, que passa de negativo em 2026 para próximo de zero em 2027, resulta sobretudo do abrandamento mais acentuado das importações, coerente com o menor dinamismo de componentes da procura com elevado conteúdo importado, como o investimento."

