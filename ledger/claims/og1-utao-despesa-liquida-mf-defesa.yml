# Excerto textual da fonte, palavra por palavra. Nunca uma paráfrase.
excerpt: "Os dados do MF constantes no relatório da POE/2027 apontam igualmente para um crescimento da despesa líquida acima da trajetória de referência no triénio 2025–2027, mas assegurando o cumprimento da regra da despesa líquida após a margem de flexibilidade permitida pela despesa com Defesa. O desvio acumulado previsto pelo MF no final de 2027 é de 0,5% do PIB após a flexibilidade da defesa (0,9% antes) (Tabela 11 e Gráfico 13), o qual fica abaixo do limiar de 0,6% do PIB estabelecido para efeitos de aferição do cumprimento da trajetória da despesa líquida."

