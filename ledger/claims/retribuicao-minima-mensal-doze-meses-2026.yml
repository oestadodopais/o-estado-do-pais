note: "[note do motor] Coordenadas do pedido: currency EUR, geo PT, 2026-S2. T5 do inventário das fontes de 01.09.2026, a linha do Eurostat. NÃO é o valor do diploma: é a conversão que a ficha earn_minw_esms explica, «when the minimum wage is paid for more than 12 months per year, data have been adjusted to take these payments into account», e por isso 1 073 e não 920,00. Publicar os dois lado a lado sem esta nota convida ao erro. O período que a resposta traz é 2026-S2, e o semestre anterior do mesmo ano traz o mesmo valor; o esquema do sítio não tem forma de período semestral, e a data de referência é por isso o ano, com o semestre dito no excerto. Última atualização do conjunto, impressa na resposta: 2026-07-31T11:00:00+0200. Licença: Eurostat, CC BY 4.0. · Cruzado de ResearchHub content/13 Dominios · retribuicao-minima-mensal-doze-meses-2026."

