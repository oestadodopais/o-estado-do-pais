note: "[note do motor] Despesa corrente de saúde segundo o SHA 2011, consumo final de bens e serviços de saúde dos residentes, sem investimento de capital. TOT_HF inclui todos os esquemas de financiamento; HF1 inclui esquemas governamentais e contributivos obrigatórios, não equivale estritamente ao financiamento público. EUR_HAB exprime euros por residente, sem correção de diferenças de preços entre países. Gémeos: a função Saúde de content/20 usa COFOG para as administrações públicas; o programa Saúde de content/15 é uma delimitação orçamental, com perímetro e base contabilística diferentes. Não formam uma série única com estas contas da saúde. O agregado UE27 é publicado pelo Eurostat, não calculado como média aritmética dos países. O valor conserva a grafia numérica da API; as bandeiras são conservadas. Fonte: Eurostat. As notas em português são da equipa de recolha; o Eurostat não é responsável por estas adaptações. · Cruzado de ResearchHub content/24 Orcamento 2027 Analise · eurostat-hlth-sha11-hf-a-eur_hab-tot_hf-pt-2024."

