note: "[note do motor] Localizador: Quadro 4.25, setor rodoviário, encargos brutos, 2027, p. 123 do PDF (107 impressa).  Previsão, não execução. O valor e a variação são os impressos na fonte. 1 — Os valores são apresentados em milhões de euros, numa ótica de fluxo de caixa e, quando aplicável, incluem imposto sobre o valor acrescentado (IVA) à taxa legal em vigor. 2 — Os valores de 2026 correspondem a estimativas para o fecho do ano, a preços do ano corrente. 3 — Os valores futuros estão a preços constantes de 2027. Apoio aos encargos e receitas: No setor rodoviário, os encargos líquidos plurianuais apresentados foram estimados com base no quadro remuneratório aplicável. Para esse efeito, foram considerados os respetivos fluxos financeiros, designadamente os encargos e as receitas, cujas principais componentes são as seguintes. • Pagamentos pela disponibilidade das vias, ajustados em função de eventuais deduções e penalidades previstas contratualmente; • Pagamentos por serviço, cuja remuneração se encontra indexada ao volume de tráfego registado; • Gastos associados ao serviço de cobrança de taxas de portagem; • Encargos suportados pelo parceiro público com a realização de grandes reparações de pavimentos, conforme o modelo de financiamento contratualmente previsto; • Outros gastos, designadamente os decorrentes de compensações a pagar a parceiros privados no âmbito de processos de reposição do equilíbrio financeiro e de decisões judiciais, quando aplicável. • Receitas oriundas da cobrança de taxas de portagem nas parcerias com vias portajadas, com exceção das parcerias em que a titularidade destas receitas pertence ao respetivo parceiro privado; • Outras receitas, designadamente as decorrentes de mecanismos de partilha de benefícios ou de receitas contratualmente previstas, bem como dos pagamentos fixos efetuados pelas subconcessionárias ao parceiro público, quando aplicável. · Cruzado de ResearchHub content/15 Orcamento do Estado 2027 · oe-2027-ppp-rodoviario-encargos-brutos-2027."

