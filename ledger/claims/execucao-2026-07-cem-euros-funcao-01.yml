ressalva_en: "The shares were rounded separately; their sum may not be exactly one hundred per cent. The source file does not print the unit; the scale in million euros was checked against revenue, expenditure and the balance in the July summary, with six exact matches. Consolidated effective expenditure excludes financial assets and liabilities and extrabudgetary transactions. Adding the functions requires the consolidation difference and may differ from the total because of rounding in the source. The budget maps and budget execution use public budget accounting and the scope stated in the name. Eurostat uses national accounts and also includes regional and local government. These measures are not directly comparable."

