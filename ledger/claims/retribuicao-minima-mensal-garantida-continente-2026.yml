note: "[note do motor] T5 do inventário das fontes de 01.09.2026, a linha do diploma. Lido no artigo 3.º, p. 2, linhas 47 a 48 da extração por pdftotext -layout do PDF alojado. O artigo 2.º restringe o diploma a todo o território continental: este valor NÃO é nacional, e os Açores e a Madeira fixam o seu por diploma regional próprio, lidos a 23.09.2026 (I136): nos Açores, o artigo 3.º do Decreto Legislativo Regional n.º 8/2002/A, de 10 de abril, republicado em anexo ao Decreto Legislativo Regional n.º 37/2023/A, de 20 de outubro (Diário da República, 1.ª série, n.º 204, p. 14 e seguintes; dre.pt/application/conteudo/223045469, sha256 e1ff875d…), diz «O montante da retribuição mínima mensal garantida, estabelecido ao nível nacional para os trabalhadores por conta de outrem, tem, na Região Autónoma dos Açores, o acréscimo de 5 %»; na Madeira, o artigo 2.º do Decreto Legislativo Regional n.º 1/2026/M, de 3 de fevereiro (Diário da República, 1.ª série, n.º 23; files.diariodarepublica.pt/1s/2026/02/02300/0001400015.pdf, sha256 0ddf54d9…), diz «O valor da retribuição mínima mensal garantida para vigorar na Região Autónoma da Madeira é de € 980,00», com efeitos a 1 de janeiro de 2026 (artigo 4.º). Nenhum dos dois valores regionais é linha deste livro. A legislação consolidada do diploma dos Açores no Diário da República não se leu (a página é uma casca de aplicação para um pedido sem navegador), pelo que o texto lido é o da republicação de 2023; os corpos lidos estão em indicators/out/i136-2026-09-23/. O artigo 7.º diz que produz efeitos a 1 de janeiro de 2026. Publicado a 2025-12-29. Não se compara com a linha do Eurostat, que é a conversão de catorze meses para doze. O endereço é o caminho que responde: a página de leitura e o endereço ELI devolvem uma casca de aplicação sem texto, e o pedido direto ao PDF em files.diariodarepublica.pt devolve 403. Licença: as condições de utilização do Diário da República eletrónico são as do Decreto-Lei n.º 83/2016, de 16 de dezembro (Diário da República, 1.ª série, n.º 240, p. 4728; dre.pt/application/conteudo/105371771, sha256 2c9bf402…, lido a 23.09.2026, I136), cujo artigo 1.º, n.º 1, estabelece «como serviço público o acesso universal e gratuito ao Diário da República, nele incluídos todo o seu conteúdo e funcionalidades, fixando as condições da sua utilização», e cujo artigo 3.º, n.º 2, diz que «O acesso universal e gratuito compreende a possibilidade de impressão, arquivo, pesquisa e livre acesso ao conteúdo dos atos publicados nas 1.ª e 2.ª séries do Diário da República, em formatos eletrónicos de acesso aberto»; a página de termos do próprio sítio, se existir, é uma casca de aplicação para um pedido sem navegador e não se leu. · Cruzado de ResearchHub content/13 Dominios · retribuicao-minima-mensal-garantida-continente-2026."

