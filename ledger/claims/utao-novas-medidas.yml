excerpt: "À semelhança do observado nas Propostas de Orçamento do Estado dos dois anos anteriores, a POE/2027 apresenta um número reduzido de novas medidas e um impacto agregado limitado sobre o saldo orçamental. O Quadro 3.2 do relatório da POE/2027 identifica apenas três novas medidas. Uma das justificações prende-se com a estratégia do Governo de adotar medidas de política orçamental fora do âmbito do Orçamento do Estado e previamente à sua apresentação, como sucedeu, por exemplo, com a redução em 1 p.p. da taxa de IRC e da taxa de IRS sobre rendas moderadas (de 25% para 10%). Após a sua adoção, estas medidas passam a integrar o cenário de políticas invariantes. Neste contexto, o reduzido impacto orçamental das novas medidas indica que o cenário orçamental para 2027 assenta essencialmente nos efeitos das medidas permanentes adotadas em anos anteriores."

