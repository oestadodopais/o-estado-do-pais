# O valor tal como é publicado, com formatação portuguesa. String, nunca número.
value: "Artigo 18.º Produção de efeitos 1 — Produzem efeitos a 1 de setembro de 2026: a) A revogação dos decretos-leis referidos no artigo anterior; b) O regime dos CIA, aprovado no anexo i ao presente decreto-lei; c) O RSAA, aprovado no anexo iii ao presente decreto-lei. 2 — As alterações ao Código do IRS, introduzidas pelo artigo 5.º, a alteração ao artigo 24.º-A do EBF, introduzida pelo artigo 7.º, e o artigo 45.º-C do EBF, aditado pelo artigo 9.º, produzem efeitos a partir de 1 de janeiro de 2026. 3 — O disposto nos n.os 7 a 9 do artigo 10.º do Código do IRS aplica-se às transmissões realizadas entre 1 de janeiro de 2026 e 31 de dezembro de 2029. 4 — As alterações ao Código do IVA, introduzidas pelo artigo 4.º, a verba 2.42.1 da lista I anexa ao Código do IVA, aditada pelo artigo 8.º, o regime previsto nos artigos 10.º e 11.º, bem como o regime aprovado como anexo ii ao presente decreto-lei produzem efeitos a partir do trimestre seguinte à entrada em vigor do presente decreto-lei, sem prejuízo do disposto nos números seguintes. 5 — A verba 2.42.1 da lista I anexa ao Código do IVA e o respetivo regime previsto nos artigos 10.º e 11.º, bem como o regime aprovado como anexo ii ao presente decreto-lei, aplicam-se às empreitadas de construção ou reabilitação relativas a operações urbanísticas cuja iniciativa procedimental se inicie no período compreendido entre 25 de setembro de 2025 e 31 de dezembro de 2029 e cuja exigibilidade do imposto ocorra a partir de 1 de janeiro de 2026. 6 — Para efeitos do número anterior, entende-se por iniciativa procedimental, designadamente: a) Nos casos de obras sujeitas a licenciamento, a apresentação do pedido de licenciamento; b) No caso de obras objeto de comunicação prévia, a apresentação da comunicação prévia; c) No caso de obras isentas de controlo prévio: i) A apresentação do parecer prévio previsto no n.º 2 do artigo 7.º do RJUE, nos casos previstos nesse artigo; ou ii) A apresentação da informação sobre o início dos trabalhos, nos restantes casos. 7 — Sem prejuízo do disposto no n.º 4, a alteração à alínea j) do n.º 1 do artigo 2.º do Código do IVA, introduzida pelo artigo 4.º, a verba 2.42.1 da lista I anexa ao Código do IVA, aditada pelo artigo 8.º, bem como o regime previsto nos artigos 10.º e 11.º, aplicam-se desde 1 de janeiro de 2026, havendo opção conjunta do prestador e do adquirente. 8 — Os pedidos a que se refere o n.º 1 do artigo 4.º do regime aprovado como anexo ii ao presente decreto-lei, relativos aos três primeiros trimestres de 2026, são entregues a partir de 1 de outubro de 2026, contando-se o prazo de 12 meses desde essa data."
