excerpt: "No 2.º trimestre de 2026, os preços da habitação aceleraram (isto é, registaram aumentos nas taxas de variação homóloga) em 10 dos 24 municípios com mais de 100 mil habitantes (em 11, no 1.º trimestre de 2026), tendo os municípios de Loures (+9,7 pontos percentuais (p.p.)) e de Matosinhos (+9,5 p.p.) apresentado os maiores acréscimos. O município de Guimarães (-13,4 p.p.) registou a maior diminuição na taxa de variação homóloga. Os municípios de Lisboa e do Porto registaram decréscimos de 8,9 p.p. e 5,4 p.p. nas taxas de variação homólogas do 1.º para o 2.º trimestre de 2026. Os municípios de Lisboa (5 299 €/m2), Cascais (5 200 €/m2) e Oeiras (4 704 €/m2) apresentaram os preços da habitação mais elevados."

