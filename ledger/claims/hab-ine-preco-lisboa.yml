excerpt: "No 1.º trimestre de 2026, os preços da habitação aceleraram (isto é, registaram aumentos nas taxas de variação homóloga) em 11 dos 24 municípios com mais de 100 mil habitantes (em 13, no 4.º trimestre de 2025), tendo os municípios do Funchal (+25,2 pontos percentuais (p.p.)) e de Guimarães (+24,1 p.p.) apresentado os maiores acréscimos. O município de Matosinhos (-11,9 p.p.) registou a maior diminuição na taxa de variação homóloga. Os municípios de Lisboa e do Porto registaram acréscimos de 0,3 p.p. e 2,4 p.p. nas taxas de variação homólogas do 4.º trimestre de 2025 para o 1.º trimestre de 2026. Os municípios de Lisboa (5 292 €/m2), Cascais (5 000 €/m2) e Oeiras (4 511 €/m2) apresentaram os preços da habitação mais elevados."

