excerpt: Corrigido a 29 de julho de 2026Esta nota apresentava ~95% como eficiência ponderada pelo volume; o rácio não é válido. Resulta de dividir totais com cobertura desigual — cerca de 120 hm³ de consumo pertencem a aproveitamentos sem captação reportada. Comparando apenas os aproveitamentos com ambos os valores, a eficiência ponderada pelo volume é 83–85%, a par da média simples de 75–76%. Só o Alqueva representa cerca de 40% do volume nacional. Citar a média simples isoladamente continua a representar mal o sistema.
