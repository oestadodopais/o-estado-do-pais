# Excerto textual da fonte, palavra por palavra. Nunca uma paráfrase.
excerpt: "A redução mais acentuada do rácio em 2027 deverá ocorrer apesar do abrandamento do crescimento do PIB nominal, refletindo sobretudo o menor crescimento do stock de dívida. Os rácios e os valores do PIB apresentados na proposta apontam para um stock de aproximadamente 284,8 mil M€ no final de 2026 e 287,8 mil M€ em 2027, com acréscimos anuais de cerca de 9,7 mil M€ e 2,9 mil M€, respetivamente. O crescimento nominal da dívida deverá, assim, abrandar de aproximadamente 3,5% para 1,0%, enquanto o PIB nominal deverá aumentar 5,5% e 4,6%. Em ambos os anos (Gráfico 18 e Gráfico 19), o rácio diminui porque o PIB nominal cresce mais rapidamente do que o stock de dívida."

