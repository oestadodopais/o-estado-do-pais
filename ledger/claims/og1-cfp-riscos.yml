id: "og1-cfp-riscos"

# O valor tal como é publicado, com formatação portuguesa. String, nunca número.
value: "A previsão orçamental para 2027 encerra riscos descendentes. Entre os riscos identificados destacam-se: (i) um crescimento da massa salarial da economia inferior ao previsto, com reflexo na receita de IRS e de contribuições sociais; (ii) um impacto da medida de combate à fraude no sector dos combustíveis aquém do previsto; (iii) a aprovação de medidas de política que possam colocar em causa as metas orçamentais estabelecidas na POE/2027; (iv) a possibilidade de o Fundo de Resolução ter de compensar determinados credores comuns do BES; (v) a materialização de despesa pública associada a passivos contingentes das AP, relacionadas com as pretensões dos parceiros privados no âmbito de parcerias público-privadas (PPP) e com outras decisões judiciais em curso, bem como garantias públicas, designadamente a relativa ao pacote habitação jovem, as concedidas à SATA pelo Governo Regional dos Açores e as associadas a linhas de crédito às empresas privadas."
