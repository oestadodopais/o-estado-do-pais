id: "og1-cfp-plausivel"

# O valor tal como é publicado, com formatação portuguesa. String, nunca número.
value: "Em conclusão, da avaliação da previsão orçamental subjacente à POE/2027 resulta ser plausível a trajetória do saldo orçamental apresentada pelo MF, embora subsistam aspetos suscetíveis de influenciar a sua concretização. Com efeito, em 2027, a diferença de 0,2 p.p. do PIB entre a projeção do CFP e a previsão do MF não assume uma expressão materialmente significativa, atendendo a que ambas apontam para uma posição orçamental próxima do equilíbrio, divergindo na composição e na quantificação de alguns agregados da receita e da despesa. Com base na informação disponível, se a projeção do CFP incorporasse os efeitos de medidas não suficientemente especificadas (combate à fraude no IVA no sector dos combustíveis e a restante receita proveniente da alienação de imóveis), bem como o impacto na liquidação de IRS decorrente da redução extraordinária das retenções na fonte de novembro de 2026, a projeção do CFP resultaria um excedente próximo do valor da POE/2027."
