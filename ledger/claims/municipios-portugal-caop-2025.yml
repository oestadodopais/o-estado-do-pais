    reason: "endereço da fonte alterado: https://geo2.dgterritorio.gov.pt/caop/ → https://www.dgterritorio.gov.pt/cartografia/cartografia-tematica/caop. O endereço antigo é a pasta onde os ficheiros da CAOP estão alojados e devolve HTTP 403 a qualquer pedido, com listagem desactivada — não é, nem nunca foi, uma página que se possa abrir. Os ficheiros por baixo dela respondem HTTP 200. A linha passa a citar a página da DGT onde a CAOP 2025 é publicada, por ser um total sobre os três ficheiros regionais. O valor não muda."
    reason_en: "source address changed: https://geo2.dgterritorio.gov.pt/caop/ → https://www.dgterritorio.gov.pt/cartografia/cartografia-tematica/caop. The old address is the directory the CAOP files sit in and returns HTTP 403 to every request, with listing disabled — it is not, and never was, a page that can be opened. The files beneath it answer HTTP 200. The row now cites the DGT page where CAOP 2025 is published, because it is a total over the three regional files. The value does not change."
