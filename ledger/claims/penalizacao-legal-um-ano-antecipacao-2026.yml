excerpt: 'No caso da reforma antecipada, os resultados indicam que a penalização actuarialmente
  neutral é mais

  elevada quando se considera o caso geral do que no caso especial. No cenário com
  𝐾 𝑥 ≠ 0 e 𝐵 𝑥+1 ≠ 𝐵 𝑥 ,

  os decréscimos marginais do factor de ajustamento situam-se em torno de 7,9% a 8,2%
  por ano, enquanto

  os decréscimos marginais sobre a pensão total ajustada se aproximam de 9,0% a 9,3%.
  No caso especial,

  os decréscimos marginais são inferiores, variando entre cerca de 5,8% e 6,8%. Assim,
  a penalização legal

  de 0,5% por mês, equivalente a cerca de 6% por ano, aproxima-se da neutralidade
  apenas no caso especial

  e, sobretudo, nas idades próximas da idade de reforma. Quando se incorporam contribuições
  e acréscimos

  de direitos, essa penalização isolada tende a ficar abaixo do valor actuarialmente
  neutral.'
