# =============================================================================
# A lista de excepções do portão de HTML.
#
# Regra da casa: todo o texto com algarismos numa página construída tem de vir
# do livro-razão. Esta lista é a única maneira de haver excepções, e cada uma
# tem de dizer porquê. Uma excepção sem motivo é um erro de build.
#
# Três mecanismos, por ordem de preferência:
#   1. <Claim id="..."/>            — o número vem do livro-razão. Não é excepção.
#   2. data-verbatim="<chave>"      — citação transcrita. O portão exige que o
#                                     texto renderizado seja IGUAL, carácter a
#                                     carácter, ao registado em src/data/verbatim.mjs.
#   3. data-nonledger="<motivo>"    — contexto estrutural, com o motivo abaixo.
#   4. tokens/patterns aqui         — último recurso, para palavras que por acaso
#                                     têm algarismos (nomes próprios, códigos).
#
# NUNCA acrescentar aqui um número que seja uma medição. Se é uma medição,
# é uma linha do livro-razão.
# =============================================================================

# Motivos aceites em data-nonledger="<motivo>".
contexts:
  - id: data-de-atualizacao
    why: >-
      Data da última revisão de uma edição de um estudo, na página do estudo. É
      uma data editorial, como a de publicação, e é uma afirmação diferente
      dela: enquanto não se souber, aparece como "[a verificar]" e não se
      preenche com a data de publicação.
  - id: data-da-conferencia
    why: >-
      A data e a hora em que o corredor diário perguntou às fontes, no cabeçalho
      de todas as páginas, e a data desde a qual uma fonte deixou de responder,
      no recibo da linha. Não são medições do país: são o estado da conferência
      e o estado da fonte, escritos pela corrida que os mediu
      (ResearchHub/indicators/corredor.py, para src/data/fontes.mjs) e nunca à
      mão. A data que o PUBLICADOR carimba é outra coisa e não passa por aqui: é
      o campo published_at do livro-razão, e vai com a marca data-linha-campo.
  - id: referencia-legal
    why: >-
      A citação de um diploma e dos seus artigos: o número do decreto-lei, o ano
      e os números do artigo. É a morada de um texto legal, como a página de um
      documento na proveniência de uma linha, e não uma medição do país. Vive no
      selo da porta legal de uma página de área de governo, com a ligação ao
      ficheiro que o Diário da República serve.
  - id: titulo-de-estudo
    why: >-
      Título literal de um estudo publicado. Vários trazem o ano no próprio
      nome ("Orçamentado, Pago, Devido 2025"). O título é uma citação, não um dado.
  - id: escala-de-instrumento
    why: >-
      Marcas da escala de um instrumento: os números do eixo são a régua, não a
      medição. O valor medido em cima da régua vem sempre do livro-razão.
  - id: limiar-do-quadro
    why: >-
      Limiar publicado num quadro institucional — o valor de referência do
      Procedimento relativo aos Desequilíbrios Macroeconómicos, fixado no
      Regulamento (UE) n.º 1176/2011 e revisto pela Comissão. É a regra contra a
      qual a medição é lida, não uma medição de Portugal: mesma natureza que a
      escala de um instrumento. A medição vem sempre do livro-razão, ao lado.
  - id: data-da-linha
    why: >-
      Uma das três datas de uma linha do livro-razão (o período de referência, a
      data de leitura, a data da última conferência), escrita na forma da casa,
      dd.mm.aaaa. Acrescentado em 2026-09-03, com a página do primeiro domínio.
      NÃO É UMA DISPENSA: o elemento diz de que linha e de que campo a data saiu
      (data-de-linha, data-de-campo) e `npm run check:formas` vai buscar aquele
      campo àquela linha, aplica-lhe `dataDaCasa()` por conta própria e compara-o
      carácter a carácter com o que a página imprimiu. Duas contas do mesmo
      facto, feitas de sítios diferentes, como no data-prova. Existe porque a
      marca forte, `data-linha-campo`, compara o texto rendido com o campo TAL
      COMO ESTÁ no ficheiro, e o ficheiro guarda ISO: a regra de uma só grafia de
      data no sítio e a comparação literal não cabem na mesma marca. A data ISO
      continua intacta no livro-razão e na página da linha, que é o recibo.
  - id: data-do-repositorio
    why: >-
      O dia em que o ficheiro de uma edição de um trabalho entrou NESTE
      repositório, `studies-src/<slug>/<lang>.html`, lido do `git log
      --diff-filter=A` na construção. Acrescentado em 2026-09-04, com a decisão
      do lugar de direção sobre as datas dos trabalhos. NÃO É a data em que o
      trabalho foi publicado noutro sítio, nem a data em que foi escrito, e é por
      isso que a origem vai dita: `src/data/studies.mjs` escreve no cabeçalho que
      nenhuma data de publicação está confirmada, e treze das dezasseis edições
      levam `date: null`. O que a casa pode provar é este dia, e prova-o quem
      tiver o repositório. Sem história (uma cópia rasa) não há data e o marcador
      volta; a régua do bloco refaz a leitura por conta própria e compara-a com o
      que a página imprimiu.
  - id: ambito-da-medida
    why: >-
      O intervalo que faz parte da DEFINIÇÃO publicada de um indicador, e não do
      seu valor: as idades da taxa de emprego («dos 20 aos 64 anos», dimensão
      age=Y20-64 do conjunto que a fonte publica) e as da taxa de desemprego
      («dos 15 aos 74 anos», age=Y15-74). É o âmbito da contagem, e está no nome
      com que o publicador nomeia a série; não é uma medição de Portugal, é o que
      se conta. Sem ele o nome da medida ficava «taxa de emprego» sozinho, que é
      outra medida: o Eurostat publica taxas de emprego para vários intervalos, e
      um nome que não diz qual delas é convida a comparar o incomparável.
      Acrescentado em 2026-09-03, com a página do primeiro domínio. O intervalo é
      declarado em `src/data/dominios.mjs`, ao lado do id da linha cujo
      `source_url` traz a dimensão.
  - id: data-de-referencia
    why: >-
      Ano ou período a que os dados se referem, quando aparece no meio de uma
      frase ("em 2000 estava a…"). É a data da leitura, não a leitura.
  - id: numeracao
    why: >-
      Numeração de secções e de instrumentos ("Instrumento n.º 1").
  - id: proveniencia
    why: >-
      Etiqueta de proveniência gerada a partir do próprio livro-razão (nome do
      estudo, edição do documento, data de acesso). Não é texto escrito à mão.
  - id: data-da-agenda
    why: >-
      Datas do registo da agenda e do calendário das fontes: quando um item foi
      proposto, decidido, criado e alterado, e quando uma fonte anuncia
      publicar. São datas do registo, não medições de Portugal. Acrescentado em
      2026-08-16, e é a primeira entrada nova desta lista desde a página de
      município: um tipo de página novo não ganha um motivo novo por existir,
      ganha-o por trazer uma classe de data que nenhum dos motivos acima
      descreve. Nenhuma destas datas é uma dispensa: cada uma vai TAMBÉM marcada
      `data-agenda="<id>.<campo>"` e o portão compara-a com o registo, carácter
      a carácter. O motivo diz porque é admissível; a comparação prova que é a
      do registo. Ver DECISIONS §1.40.
  - id: identificador-tecnico
    why: >-
      Identificadores técnicos: códigos de cor, códigos de língua, versões,
      nomes de ficheiros.
  - id: fonte-da-carta
    why: >-
      A menção da fonte do desenho do mapa: a entidade proprietária da
      informação, o nome e a edição da Carta Administrativa Oficial de Portugal,
      e a licença sob a qual a Direção-Geral do Território a publica. Traz
      algarismos por duas razões, e as duas são identificação e não medição: a
      edição da Carta faz parte do nome dela ("CAOP 2025", a sigla de Carta
      Administrativa Oficial de Portugal), e uma licença
      identifica-se pela versão ("CC BY 4.0" e não "CC BY"). As três cadeias não
      são escritas no gabarito: saem de `mapa/manifest.json`, que o motor
      escreveu das constantes onde a frase da DGT foi transcrita da fonte, e o
      `npm run check:mapa` confere que a menção está onde o mapa está. É a única
      obrigação da licença da CAOP, e a Emenda 20e manda escrevê-la ao pé do
      desenho.
  - id: licenca-do-conjunto
    why: >-
      O nome da licença sob a qual o conjunto de dados do livro-razão é
      oferecido: CC BY 4.0, decidida e escrita em `src/data/licenca.mjs`. Traz
      algarismos porque uma licença se identifica pela sua versão, e é isso
      mesmo que o leitor precisa de ler: "CC BY" sem versão não são termos. Não
      é uma medição de Portugal nem um número deste sítio: é o nome que um
      terceiro dá aos termos em que este conjunto sai. Nenhum dos outros motivos
      o descreve, não é escala, nem limiar, nem título de trabalho, nem data,
      nem identificador da própria máquina. A licença de um ficheiro alojado
      numa linha é outra coisa e continua a entrar pela origem 6
      (`document.hosted.licence`, comparada contra a linha): esta é a licença do
      CONJUNTO, que não tem linha. Acrescentado em 2026-08-18 (DECISIONS §1.47,
      T4). A razão foi reescrita a 03.09.2026 (bloco F0.7): dizia «enquanto
      `LICENCA` for `null` este motivo não é usado por nenhuma página, e está
      registado na §4.3», e as duas metades deixaram de ser verdade. `LICENCA`
      tem valor e o motivo rende-se em `src/views/LivroView.astro`.

# Palavras que contêm algarismos mas não são medições. Correspondência exacta.
# scope: any | body | head
#
# DUAS ENTRADAS SAÍRAM A 03.09.2026, no primeiro dia em que o portão passou a
# recusar uma excepção que não dispensa nada (bloco F0.7):
#
#   · 'CAOP', que não tem um algarismo. O varrimento só pergunta pela lista
#     quando o token TRAZ algarismos, portanto esta entrada nunca era
#     consultada. O que ela esclarecia está dito no motivo `fonte-da-carta`,
#     que é onde a sigla aparece com a edição atrás («CAOP 2025»);
#   · 'PT2030', que dispensava zero ocorrências. A palavra existe em quatro
#     páginas construídas e as quatro são de classes que já saem do varrimento
#     por outra via: três documentos alojados (obra citada) e uma página de
#     leitura (comparada carácter a carácter contra o registo de conteúdo). As
#     duas linhas do livro-razão que a trazem no seu id escrevem-no em
#     minúsculas, que não é a mesma cadeia. Se um dia a prosa da casa escrever
#     «PT2030», o portão fecha e a entrada volta com uma razão nova e medida.
tokens:
  - token: 'UE-27'
    scope: any
    why: Nome do agregado de referência da União Europeia. É um nome, não um valor.
  - token: 'EU-27'
    scope: any
    why: O mesmo nome, na edição inglesa.
  - token: '73/2013'
    scope: body
    why: >-
      O número da lei que fixa o limite de dívida total de um município (Lei
      n.º 73/2013, o regime financeiro das autarquias locais). É o NOME de uma
      lei, da mesma classe que "UE-27": não mede nada e não pode ser escrito
      sem algarismos. A medição que ele enquadra — o limite legal e o índice
      contra ele — tem linha própria no livro-razão, ao lado. Acrescentado em
      2026-08-15 para a página de município; ver DECISIONS §1.34.
  - token: 'sha256'
    scope: body
    why: >-
      O nome da função de resumo criptográfico com que este sítio prende os
      bytes de um ficheiro alojado e do ficheiro da fonte de onde ele saiu
      (bloco T3, DECISIONS §1.47). É o NOME do algoritmo, da mesma classe que
      "UE-27": não mede nada, e o "256" que ele traz é o comprimento do resumo
      em bits, escrito dentro do nome. O resumo em si é um campo da linha,
      marcado `data-linha-campo` e conferido carácter a carácter ao lado.
  - token: '52.º'
    scope: body
    why: >-
      O artigo dessa lei onde o limite é definido (uma vez e meia a média da
      receita corrente líquida dos três anos anteriores). Mesma natureza do
      token acima: é a referência a um artigo, não uma quantidade. Escrever
      "o artigo cinquenta e dois" passaria no portão e seria pior — a
      referência deixaria de ser verificável contra o diploma.

# Padrões, para quando a correspondência exacta não chega. Usar com parcimónia.
patterns: []
