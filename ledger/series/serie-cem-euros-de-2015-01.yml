note: "RP3. Série derivada da serie-ipc-indice, ponto a ponto, pela conta 'round ( 100 * serie-ipc-indice[2015-01] / serie-ipc-indice[t] , 3 )', refeita pelo avaliador exato da casa (core.derivations), com 3 casa(s) decimal(is), as da metainformação do índice de origem."

