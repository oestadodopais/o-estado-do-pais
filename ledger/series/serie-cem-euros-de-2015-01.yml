# Numa série derivada, a conta em palavras nas duas línguas, as séries de origem e a
# expressão que o sítio refaz ponto a ponto na construção.
derivation: "Para cada mês t desde janeiro de 2015: 100 × I(janeiro de 2015) ÷ I(t), em que I é o índice de preços no consumidor do INE (base 2025 = 100, Portugal, total); o resultado arredonda-se às casas decimais com que o INE publica o índice. É o que cem euros compram no mês t, contado em euros de janeiro de 2015."
derivation_en: "For each month t from January 2015: 100 × I(January 2015) ÷ I(t), where I is the INE consumer price index (base 2025 = 100, Portugal, total); the result is rounded to the decimal places INE publishes the index with. It is what one hundred euros buy in month t, counted in January 2015 euros."
derived_from:
  - "serie-ipc-indice"
check: "round ( 100 * serie-ipc-indice[2015-01] / serie-ipc-indice[t] , 3 )"

