# Numa série derivada, a conta em palavras nas duas línguas, as séries de origem e a
# expressão que o sítio refaz ponto a ponto na construção.
derivation: "Para cada ano t: W(t) × I(2015) ÷ I(t), em que W é a remuneração bruta mensal média por trabalhador que o INE publica por ano (Portugal, total) e I é o índice de preços no consumidor do INE em média anual (base 2025 = 100, Portugal, total); o resultado arredonda-se às casas decimais com que o INE publica a remuneração. É a remuneração de cada ano contada em euros de 2015, isto é, descontada a subida dos preços desde esse ano."
derivation_en: "For each year t: W(t) × I(2015) ÷ I(t), where W is the average gross monthly pay per worker that INE publishes by year (Portugal, total) and I is the INE consumer price index as an annual average (base 2025 = 100, Portugal, total); the result is rounded to the decimal places INE publishes the pay with. It is each year's pay counted in 2015 euros, that is, net of the rise in prices since that year."
derived_from:
  - "serie-remuneracao-bruta-mensal-media-anual"
  - "serie-ipc-indice-anual"
check: "round ( serie-remuneracao-bruta-mensal-media-anual[t] * serie-ipc-indice-anual[2015] / serie-ipc-indice-anual[t] , 0 )"

