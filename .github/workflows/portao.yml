# The gate: the checks, the build and the tests on every push, on a clean host.
# The job's name `portao` is the check that main's protection requires; renaming it
# means changing that protection.
name: portao

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portao:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python3 -m pip install -r requirements.txt
      # Check 4 proves against main that a piece's record only grows.
      - name: Main, for the history of the records
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # The private store of sources, read-only, once its key exists (the repository secret
      # FONTES_CHAVE, a deploy key of oestadodopais/o-estado-do-pais-fontes). This step learns
      # only whether the key exists, never the key; the key is given to the checkout alone.
      - name: Whether the store's key exists
        id: fontes
        env:
          TEM_CHAVE: ${{ secrets.FONTES_CHAVE != '' }}
        run: |
          if [ "$TEM_CHAVE" = "true" ]; then
            echo "pasta=$RUNNER_TEMP/fontes" >> "$GITHUB_OUTPUT"
            echo "FONTES_CHAVE is set: the store of sources is checked out, read-only, for the checks"
          else
            echo "FONTES_CHAVE is not set: the checks run without the store of sources, as before"
          fi
      - name: The store of sources, read-only
        if: steps.fontes.outputs.pasta != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oestadodopais/o-estado-do-pais-fontes
          ssh-key: ${{ secrets.FONTES_CHAVE }}
          persist-credentials: false
          path: .fontes-por-mover
      # The action places a checkout under the workspace; the commands refuse a store inside
      # the repository's tree, so it is moved out before anything reads it.
      - name: The store, moved outside the checked-out tree
        if: steps.fontes.outputs.pasta != ''
        run: mv .fontes-por-mover "${{ steps.fontes.outputs.pasta }}"
      # The secret is given to this step only, not to the one that installs dependencies.
      - name: Checks, build and tests
        env:
          PRIVACIDADE_PROIBIDOS: ${{ secrets.PRIVACIDADE_PROIBIDOS }}
          OEDP_FONTES: ${{ steps.fontes.outputs.pasta }}
        run: python3 -m oedp tudo
      # The suite again with Python's clock moved one day and four hundred days ahead, so that a
      # test that depends on the day it runs fails on the day it is written (tests/adiante.py).
      # The store as for the checks; not PRIVACIDADE_PROIBIDOS, which check 8 lets only the step
      # that runs the checks have. Without the list, check 8 fails wherever GITHUB_ACTIONS is set,
      # so this step runs the suite with it taken out, as on a laptop or in a fresh clone; the
      # gate's own check 8, with the list, is the step above.
      - name: The suite with the clock moved ahead
        env:
          OEDP_FONTES: ${{ steps.fontes.outputs.pasta }}
        run: env -u GITHUB_ACTIONS python3 -m oedp adiante
      # A link to a receipt opens it, proven in three browser engines. These are steps of
      # this job, not a job of their own, so the required check cannot go green around them.
      - name: Browsers, for the browser test
        run: |
          python3 -m pip install -r requirements-navegador.txt
          python3 -m playwright install --with-deps chromium firefox webkit
      - name: A link to a receipt opens it, in three engines
        run: python3 -m oedp navegador --exigir chromium,firefox,webkit
