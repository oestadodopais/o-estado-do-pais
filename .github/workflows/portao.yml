# The gate: the checks, the build and the tests on every push, on a clean host.
# The job's name `portao` is the check that main's protection requires; renaming it
# means changing that protection.
name: portao

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portao:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRIVACIDADE_PROIBIDOS: ${{ secrets.PRIVACIDADE_PROIBIDOS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Checks, build and tests
        run: python3 -m oedp tudo
