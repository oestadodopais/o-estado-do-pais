# O portão da casa, corrido pelo GitHub e não pela memória de quem constrói.
#
# Porquê: a 01.09 um commit vermelho chegou a `main` e foi o Vercel a recusá-lo,
# aos 15 s, depois do push. A auditoria de 02.09 escreveu-o como o terceiro risco
# («nenhuma CI, nenhuma verificação obrigatória em `main`: os três portões da casa
# são uma promessa»). Este ficheiro transforma a promessa em condição: os três
# comandos que a casa exige antes de cada commit passam a correr no GitHub, em
# cada push e em cada pedido de integração, num anfitrião limpo que não tem o
# `node_modules` de ninguém nem o `dist/` de uma construção anterior.
#
# O QUE ISTO CONFERE, À LETRA (leitura a frio do Codex, achado 3): a cabeça de
# cada push e de cada pedido de integração, e não cada commit lá dentro. Um push
# com cinco commits produz uma corrida, sobre o quinto. É por isso que a regra da
# casa (os três portões a 0 em cada commit) continua a ser da casa: a CI garante
# que o que chega a `main` foi conferido, não que cada passo do caminho o foi.
#
name: portão

on:
  push:
  pull_request:

# Nada mais do que ler a árvore. Sem escrita, sem pacotes, sem `id-token`.
permissions:
  contents: read
  actions: read

# Uma corrida por referência. O push de um ramo e o pedido de integração desse
# ramo já correm em referências distintas (`refs/heads/<ramo>` e
# `refs/pull/<n>/merge`), de modo que o `github.ref` sozinho bastava: o
# `event_name` fica por ser explícito e nunca poder agrupar dois acontecimentos
# na mesma chave, e não porque sem ele uma corrida cancelasse a outra (leitura a
# frio do Codex, achado 10; a primeira redação dizia o contrário e estava
# errada). O `cancel-in-progress` cancela a corrida anterior da MESMA
# referência: um segundo push cancela o primeiro, e a corrida que conta para uma
# verificação obrigatória é sempre a do resumo que se vai fundir.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# AT1: o nome do trabalho `portao` é o contexto obrigatório da proteção de main.
# Só fica verde depois de todas as partes; renomeá-lo exige atualizar essa proteção.
jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRIVACIDADE_PROIBIDOS: ${{ secrets.PRIVACIDADE_PROIBIDOS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A árvore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: O Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: O Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: O zsh, para a planta da aterragem
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: O PyYAML, para o pacote das leituras
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml

      - name: Construção e typecheck
        run: |
          node scripts/verify-partes.mjs construir
          npm run typecheck
          node scripts/verify-partes.mjs planear
          tar -cpf /tmp/dist.tar dist at1-build.json
      - name: Dist para as conferências
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.sha }}
          path: /tmp/dist.tar
          retention-days: 1
          if-no-files-found: error
  conferir:
    needs: construir
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRIVACIDADE_PROIBIDOS: ${{ secrets.PRIVACIDADE_PROIBIDOS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A árvore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: O Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: O Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: O zsh, para a planta da aterragem
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: O PyYAML, para o pacote das leituras
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y -qq python3-yaml

      - name: O dist desta corrida, com as datas intactas
        run: |
          gh run download "$GITHUB_RUN_ID" --name dist-${{ github.sha }} --dir /tmp/at1-dist
          tar -xpf /tmp/at1-dist/dist.tar
      - name: A parte, com as provas U, D e C
        run: node scripts/verify-partes.mjs parte ${{ matrix.parte }} /tmp/parte-${{ matrix.parte }}.json
      - name: Prova da parte verde
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parte-${{ matrix.parte }}-${{ github.sha }}
          path: /tmp/parte-${{ matrix.parte }}.json
          retention-days: 14
          if-no-files-found: error
  portao:
    needs: [construir, conferir]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRIVACIDADE_PROIBIDOS: ${{ secrets.PRIVACIDADE_PROIBIDOS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Todas as tarefas passaram
        run: test '${{ needs.construir.result }}' = success && test '${{ needs.conferir.result }}' = success
      - name: A árvore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: O Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: O dist desta corrida, com as datas intactas
        run: |
          gh run download "$GITHUB_RUN_ID" --name dist-${{ github.sha }} --dir /tmp/at1-dist
          tar -xpf /tmp/at1-dist/dist.tar
      - name: Reunir as provas e conferir a união inteira
        run: |
          for i in 0 1 2 3 4 5; do
            gh run download "$GITHUB_RUN_ID" --name parte-$i-${{ github.sha }} --dir /tmp/at1-partes
          done
          node scripts/verify-partes.mjs juntar /tmp/at1-partes /tmp/uniao.json
          test -f dist/prova.json
          test -f dist/cadeia.json
          mkdir /tmp/at1-prova
          cp dist/prova.json dist/cadeia.json /tmp/uniao.json /tmp/at1-prova/
      - name: A prova desta corrida
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prova-${{ github.sha }}
          path: /tmp/at1-prova/
          retention-days: 14
          if-no-files-found: error
